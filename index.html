<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Module</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="password-card">
      <h2>Create Password</h2>

      <!-- Password Input Group -->
      <div class="input-group">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="off"
        />
        <button
          type="button"
          id="toggleBtn"
          aria-label="Toggle password visibility"
        >
          <!-- Eye Open Icon -->
          <svg
            id="eyeOpen"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <!-- Eye Closed Icon -->
          <svg
            id="eyeClosed"
            class="hidden"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path
              d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
            />
            <path
              d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
            />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        </button>
      </div>

      <!-- Strength Meter -->
      <div class="strength-wrapper">
        <div class="strength-header">
          <span>Password Strength</span>
          <span id="strengthText">Too Weak</span>
        </div>
        <div class="strength-bar-bg">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
      </div>

      <!-- Requirements Checklist -->
      <ul class="criteria-list">
        <li data-criterion="length">
          <span class="icon">✕</span> At least 8 characters
        </li>
        <li data-criterion="lowercase">
          <span class="icon">✕</span> At least 1 lowercase letter
        </li>
        <li data-criterion="uppercase">
          <span class="icon">✕</span> At least 1 uppercase letter
        </li>
        <li data-criterion="number">
          <span class="icon">✕</span> At least 1 number
        </li>
        <li data-criterion="symbol">
          <span class="icon">✕</span> At least 1 special character (!@#$)
        </li>
      </ul>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
